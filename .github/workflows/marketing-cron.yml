name: Marketing campaign batch processing

# Scheduled through GitHub Actions, but executed on a self-hosted runner so it
# does not consume GitHub-hosted Actions minutes.
# It only calls the secret-protected internal endpoint exposed by the app.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: marketing-cron
  cancel-in-progress: false

jobs:
  process-marketing-queue:
    runs-on: self-hosted
    timeout-minutes: 2
    steps:
      - name: Call the marketing batch endpoint
        run: |
          status=$(curl -s -o response.json -w "%{http_code}" \
            -X POST "${MARKETING_APP_BASE_URL}/api/marketing/process" \
            -H "Authorization: Bearer ${MARKETING_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"maxTicks": 20}')
          echo "HTTP status: $status"
          cat response.json || true
          if [ "$status" -ge 300 ]; then
            echo "Marketing batch endpoint returned an error status."
            exit 1
          fi
        env:
          MARKETING_APP_BASE_URL: ${{ secrets.MARKETING_APP_BASE_URL }}
          MARKETING_CRON_SECRET: ${{ secrets.MARKETING_CRON_SECRET }}
