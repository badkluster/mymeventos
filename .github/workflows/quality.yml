name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, testing, 'fix/**']

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @mym/shared run build

      - name: Typecheck API
        run: pnpm --filter @mym/api run typecheck

      - name: Test API
        run: pnpm --filter @mym/api run test

      - name: Typecheck web
        run: pnpm --filter @mym/web run typecheck

      - name: Build web
        run: pnpm --filter @mym/web run build
