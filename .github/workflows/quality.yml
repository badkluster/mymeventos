name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, testing, 'fix/**']

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @mym/shared run build

      - name: Typecheck API
        run: |
          set -o pipefail
          pnpm --filter @mym/api run typecheck 2>&1 | tee api-typecheck.log

      - name: Test API
        run: |
          set -o pipefail
          pnpm --filter @mym/api run test 2>&1 | tee api-tests.log

      - name: Typecheck web
        run: |
          set -o pipefail
          pnpm --filter @mym/web run typecheck 2>&1 | tee web-typecheck.log

      - name: Build web
        run: |
          set -o pipefail
          pnpm --filter @mym/web run build 2>&1 | tee web-build.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-diagnostics
          path: |
            api-typecheck.log
            api-tests.log
            web-typecheck.log
            web-build.log
          if-no-files-found: ignore
          retention-days: 7
