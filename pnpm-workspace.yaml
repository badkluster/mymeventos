packages:
  - apps/*
  - packages/*

# Expo/React Native native builds on Windows are sensitive to the very long
# paths generated by pnpm's isolated virtual store. Hoisting keeps native
# module and CMake paths short enough for local Android release builds.
nodeLinker: hoisted

ignoredBuiltDependencies:
  - '@scarf/scarf'
  - bcrypt

onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
  - bcrypt


